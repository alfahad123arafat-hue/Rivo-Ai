name: Build Rivo AI APK

on:
  push:
    branches: [ "main", "arena/**", "arena/45292205-rivo-ai" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve dependencies
        run: ./gradlew --version

      - name: Kotlin compile
        run: ./gradlew compileDebugKotlin --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK exists and non-empty
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then echo "APK not found at $APK"; ls -R app/build/outputs/ || true; exit 1; fi
          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -lt 10000 ]; then echo "APK too small: $SIZE"; exit 1; fi
          echo "APK OK: $SIZE bytes"
          ls -lh "$APK"

      - name: Build Release APK (if signing available)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            ./gradlew assembleRelease --stacktrace
          else
            echo "No signing config, skipping release"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rivo-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        if: hashFiles('app/build/outputs/apk/release/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rivo-ai-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/
            app/build/outputs/logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build Status Report
        if: always()
        run: |
          echo "## Build Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ Debug APK built successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Download from Artifacts: rivo-ai-debug-apk" >> $GITHUB_STEP_SUMMARY
            ls -lh app/build/outputs/apk/debug/*.apk >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build failed" >> $GITHUB_STEP_SUMMARY
          fi
