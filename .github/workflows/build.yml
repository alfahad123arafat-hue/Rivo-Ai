name: Build Rivo AI APK

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Resolve dependencies
        run: ./gradlew --version

      - name: Kotlin compile
        id: kotlin_compile
        run: |
          set -o pipefail
          ./gradlew compileDebugKotlin --stacktrace 2>&1 | tee kotlin_compile.log
          echo "exit:$?" > kotlin_exit.txt

      - name: Capture Kotlin compile failure logs
        if: failure() && steps.kotlin_compile.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Kotlin Compile Failed — Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 400 kotlin_compile.log >> $GITHUB_STEP_SUMMARY || echo "no log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Also create an issue with full log (truncated) for retrieval via api.github.com (allowed)
          FULL=$(tail -n 800 kotlin_compile.log | head -c 60000)
          BODY="Kotlin compile failed on $GITHUB_SHA\n\n\`\`\`\n$FULL\n\`\`\`\n\n[View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          echo "$BODY" > /tmp/issue_body.md
          gh issue create --title "🔴 Kotlin compile failed — ${{ github.sha }}" --body-file /tmp/issue_body.md --label "bug" 2>&1 || echo "issue creation attempted"
          # Also post as check-run annotation summary
          cat kotlin_compile.log | tail -n 200

      - name: Run unit tests
        if: success()
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android Lint
        if: success()
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Build Debug APK
        if: success()
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK exists and non-empty
        if: success()
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then echo "APK not found at $APK"; ls -R app/build/outputs/ || true; exit 1; fi
          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -lt 10000 ]; then echo "APK too small: $SIZE"; exit 1; fi
          echo "APK OK: $SIZE bytes"
          ls -lh "$APK"

      - name: Build Release APK (if signing available)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            ./gradlew assembleRelease --stacktrace
          else
            echo "No signing config, skipping release"

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rivo-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        if: hashFiles('app/build/outputs/apk/release/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rivo-ai-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/
            kotlin_compile.log
            kotlin_exit.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Build Status Report
        if: always()
        run: |
          echo "## Build Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ Debug APK built successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Download from Artifacts: rivo-ai-debug-apk" >> $GITHUB_STEP_SUMMARY
            ls -lh app/build/outputs/apk/debug/*.apk >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build failed — see Kotlin compile logs above or check Issues for auto-created log" >> $GITHUB_STEP_SUMMARY
          fi
