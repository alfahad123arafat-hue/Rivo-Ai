name: Build Rivo AI APK

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve dependencies
        run: ./gradlew --version

      - name: Kotlin compile
        id: kotlin_compile
        run: |
          set -o pipefail
          ./gradlew compileDebugKotlin --stacktrace 2>&1 | tee kotlin_compile.log
          echo "exit:$?" > kotlin_exit.txt

      - name: Capture Kotlin compile failure logs
        if: failure() && steps.kotlin_compile.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Kotlin Compile Failed — Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 400 kotlin_compile.log >> $GITHUB_STEP_SUMMARY || echo "no log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          FULL=$(tail -n 800 kotlin_compile.log | head -c 60000)
          BODY="Kotlin compile failed on $GITHUB_SHA\n\n\`\`\`\n$FULL\n\`\`\`\n\n[View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          echo "$BODY" > /tmp/issue_body.md
          gh issue create --title "🔴 Kotlin compile failed — ${{ github.sha }}" --body-file /tmp/issue_body.md --label "bug" 2>&1 || echo "issue creation attempted"
          cat kotlin_compile.log | tail -n 200

      - name: Run unit tests
        if: success()
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android Lint
        if: success()
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Build Debug APK
        if: success()
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK exists and non-empty
        if: success()
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then echo "APK not found at $APK"; ls -R app/build/outputs/ || true; exit 1; fi
          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -lt 10000 ]; then echo "APK too small: $SIZE"; exit 1; fi
          echo "APK OK: $SIZE bytes"
          ls -lh "$APK"

      - name: Build Release APK (if signing available)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            ./gradlew assembleRelease --stacktrace
          else
            echo "No signing config, skipping release"
          fi

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rivo-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        if: hashFiles('app/build/outputs/apk/release/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rivo-ai-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/
            kotlin_compile.log
            kotlin_exit.txt
            ai_repair_audit.log
            ai_response.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Build Status Report
        if: always()
        run: |
          echo "## Build Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ Debug APK built successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Download from Artifacts: rivo-ai-debug-apk" >> $GITHUB_STEP_SUMMARY
            ls -lh app/build/outputs/apk/debug/*.apk >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build failed — see Kotlin compile logs above or check Issues for auto-created log" >> $GITHUB_STEP_SUMMARY
          fi

      # — AI-assisted repair workflow (log → patch → validate → retry → audit) —
      - name: AI Repair — collect logs and request fix
        if: failure() && steps.kotlin_compile.outcome == 'failure'
        env:
          AI_REPAIR_API_KEY: ${{ secrets.AI_REPAIR_API_KEY }}
          AI_REPAIR_BASE_URL: ${{ secrets.AI_REPAIR_BASE_URL }}
          AI_REPAIR_MODEL: ${{ secrets.AI_REPAIR_MODEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🤖 AI Repair workflow triggered" | tee ai_repair_audit.log
          echo "Branch: $GITHUB_REF  SHA: $GITHUB_SHA" | tee -a ai_repair_audit.log
          echo "Base URL: ${AI_REPAIR_BASE_URL:-https://api.openai.com/v1}" | tee -a ai_repair_audit.log
          echo "Model: ${AI_REPAIR_MODEL:-gpt-4o-mini}" | tee -a ai_repair_audit.log
          LOG=$(tail -n 800 kotlin_compile.log | head -c 30000 | jq -Rs . 2>/dev/null || python3 -c "import json,sys; print(json.dumps(open('kotlin_compile.log').read()[-30000:]))")
          echo "Collected $(wc -c < kotlin_compile.log) bytes of compile log" | tee -a ai_repair_audit.log
          if [ -z "$AI_REPAIR_API_KEY" ]; then
            echo "No AI_REPAIR_API_KEY secret — skipping AI call, audit only" | tee -a ai_repair_audit.log
            echo '{"skipped":"no key"}' > ai_response.json
            exit 0
          fi
          PAYLOAD=$(jq -n --arg log "$(tail -n 800 kotlin_compile.log | head -c 15000)" --arg model "${AI_REPAIR_MODEL:-gpt-4o-mini}" '{
            model: $model,
            messages: [
              {role:"system", content:"You are a Kotlin Android expert. Given a Kotlin compile error log, suggest a minimal patch as a unified diff. Only output the diff."},
              {role:"user", content: $log}
            ],
            temperature: 0.2,
            max_tokens: 2000
          }')
          echo "$PAYLOAD" > /tmp/ai_payload.json
          echo "Calling ${AI_REPAIR_BASE_URL:-https://api.openai.com/v1}/chat/completions ..." | tee -a ai_repair_audit.log
          HTTP_CODE=$(curl -s -o ai_response.json -w "%{http_code}" -X POST "${AI_REPAIR_BASE_URL:-https://api.openai.com/v1}/chat/completions" \
            -H "Authorization: Bearer $AI_REPAIR_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/ai_payload.json || echo "000")
          echo "AI API HTTP $HTTP_CODE" | tee -a ai_repair_audit.log
          cat ai_response.json | head -c 2000 | tee -a ai_repair_audit.log || true
          echo "" | tee -a ai_repair_audit.log
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ AI repair response received — manual review required" | tee -a ai_repair_audit.log
            # Extract patch if present and validate as diff
            python3 -c "
          import json, pathlib
          try:
              j=json.loads(pathlib.Path('ai_response.json').read_text())
              content=j['choices'][0]['message']['content']
              pathlib.Path('ai_suggested_patch.diff').write_text(content)
              print('Patch extracted to ai_suggested_patch.diff', len(content), 'chars')
          except Exception as e:
              print('No patch extracted:', e)
          " 2>&1 | tee -a ai_repair_audit.log || true
          else
            echo "⚠️ AI call failed with $HTTP_CODE — see ai_response.json" | tee -a ai_repair_audit.log
          fi
          echo "Audit complete at $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a ai_repair_audit.log
